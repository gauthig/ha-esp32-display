<svg viewBox="0 0 800 480" width="800" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- ================================================================ -->
  <!-- STATUS BAR (y: 0-40)                                             -->
  <!-- ================================================================ -->
  <text x="10" y="29" font-size="17" font-weight="bold" fill="#58a6ff">&#9889; ENERGY MONITOR</text>
  <text x="776" y="27" font-size="13" fill="#7d8590" text-anchor="end">02:45 PM  Wed Aug 06</text>
  <circle cx="788" cy="20" r="6" fill="#3fb950"/>

  <!-- Separator -->
  <rect x="0" y="41" width="800" height="1" fill="#30363d"/>

  <!-- ================================================================ -->
  <!-- CARD 1: TODAY  (x=6, y=48, w=258, h=168)                        -->
  <!-- ================================================================ -->
  <rect x="6" y="48" width="258" height="168" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="68" font-size="12" fill="#7d8590">TODAY</text>
  <text x="135" y="148" font-size="46" font-weight="bold" fill="#e3a435" text-anchor="middle">27.4</text>
  <text x="135" y="174" font-size="17" fill="#7d8590" text-anchor="middle">kWh</text>
  <text x="135" y="207" font-size="12" fill="#7d8590" text-anchor="middle">grid | 8.5 kWh solar</text>

  <!-- ================================================================ -->
  <!-- CARD 2: GRID  (x=270, y=48, w=258, h=168)                       -->
  <!-- ================================================================ -->
  <rect x="270" y="48" width="258" height="168" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="68" font-size="12" fill="#7d8590">GRID</text>
  <text x="399" y="148" font-size="28" font-weight="bold" fill="#e3a435" text-anchor="middle">1.24 kW</text>
  <text x="399" y="205" font-size="17" font-weight="bold" fill="#e3a435" text-anchor="middle">&#8595; IMPORTING</text>

  <!-- ================================================================ -->
  <!-- CARD 3: SOLAR  (x=534, y=48, w=258, h=168)                      -->
  <!-- ================================================================ -->
  <rect x="534" y="48" width="258" height="168" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="544" y="68" font-size="12" fill="#7d8590">&#8635;  SOLAR</text>
  <text x="663" y="148" font-size="28" font-weight="bold" fill="#3fb950" text-anchor="middle">2.15 kW</text>
  <text x="663" y="200" font-size="14" fill="#7d8590" text-anchor="middle">8.50 kWh today</text>

  <!-- ================================================================ -->
  <!-- TOP LOCATION CARD  (x=6, y=222, w=788, h=108)                   -->
  <!-- ================================================================ -->
  <rect x="6" y="222" width="788" height="108" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="242" font-size="12" fill="#7d8590">TOP LOCATION</text>
  <text x="16" y="268" font-size="22" font-weight="bold" fill="#e6edf3">Master BR</text>
  <text x="784" y="268" font-size="22" font-weight="bold" fill="#e3a435" text-anchor="end">847 W  39%</text>
  <rect x="16" y="285" width="768" height="20" rx="4" fill="#21262d"/>
  <rect x="16" y="285" width="768" height="20" rx="4" fill="#e3a435"/>

  <!-- ================================================================ -->
  <!-- CIRCUIT LIST CARD  (x=6, y=336, w=788, h=138)                   -->
  <!-- Circuits 2-6 by draw — top location excluded from list           -->
  <!-- ================================================================ -->
  <rect x="6" y="336" width="788" height="138" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="354" font-size="12" fill="#7d8590">CIRCUITS</text>

  <!-- Row 0: A/C 73% of top -->
  <text x="16" y="382" font-size="14" fill="#e6edf3">A/C</text>
  <rect x="170" y="369" width="528" height="16" rx="3" fill="#21262d"/>
  <rect x="170" y="369" width="385" height="16" rx="3" fill="#58a6ff"/>
  <text x="784" y="382" font-size="14" fill="#7d8590" text-anchor="end">620 W</text>

  <!-- Row 1: Pool 57% -->
  <text x="16" y="404" font-size="14" fill="#e6edf3">Pool</text>
  <rect x="170" y="391" width="528" height="16" rx="3" fill="#21262d"/>
  <rect x="170" y="391" width="301" height="16" rx="3" fill="#58a6ff"/>
  <text x="784" y="404" font-size="14" fill="#7d8590" text-anchor="end">480 W</text>

  <!-- Row 2: EV Charger 28% -->
  <text x="16" y="426" font-size="14" fill="#e6edf3">EV Charger</text>
  <rect x="170" y="413" width="528" height="16" rx="3" fill="#21262d"/>
  <rect x="170" y="413" width="148" height="16" rx="3" fill="#58a6ff"/>
  <text x="784" y="426" font-size="14" fill="#7d8590" text-anchor="end">240 W</text>

  <!-- Row 3: Laundry 22% -->
  <text x="16" y="448" font-size="14" fill="#e6edf3">Laundry</text>
  <rect x="170" y="435" width="528" height="16" rx="3" fill="#21262d"/>
  <rect x="170" y="435" width="116" height="16" rx="3" fill="#58a6ff"/>
  <text x="784" y="448" font-size="14" fill="#7d8590" text-anchor="end">185 W</text>

  <!-- Row 4: HVAC Fan 14% -->
  <text x="16" y="468" font-size="14" fill="#e6edf3">HVAC Fan</text>
  <rect x="170" y="457" width="528" height="16" rx="3" fill="#21262d"/>
  <rect x="170" y="457" width="74" height="16" rx="3" fill="#58a6ff"/>
  <text x="784" y="468" font-size="14" fill="#7d8590" text-anchor="end">120 W</text>

</svg>
